[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cause-tune"
version = "0.1.0"
description = "Controlled and measured LLM post-training experiments with QLoRA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.0",
  "transformers>=4.40",
  "peft>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
gpu = [
  "bitsandbytes>=0.43",
  "trl>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["causetune*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
