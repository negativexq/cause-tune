name: ci

on:
  push:
  pull_request:

jobs:
  cpu-safe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-safe development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Test
        run: pytest -q
