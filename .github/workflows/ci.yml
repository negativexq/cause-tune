name: ci

on:
  push:
  pull_request:

jobs:
  cpu-safe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-safe development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q src scripts tests
      - name: Test
        run: pytest -q

  training-smoke:
    runs-on: ubuntu-latest
    env:
      HF_HOME: ${{ github.workspace }}/.hf-cache
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: ${{ runner.os }}-cause-tune-tiny-gpt2-v1-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-cause-tune-tiny-gpt2-v1-
      - name: Install model-backed smoke dependencies
        run: python -m pip install -e .
      - name: Run real Trainer and PEFT smoke
        run: python scripts/model_backed_smoke.py --model-id hf-internal-testing/tiny-random-GPT2 --output-dir /tmp/cause-tune-model-smoke
